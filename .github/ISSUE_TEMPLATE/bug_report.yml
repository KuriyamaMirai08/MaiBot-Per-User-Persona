name: Bug report / 问题反馈
description: Report a reproducible failure without publishing private chat data.
body:
  - type: input
    id: versions
    attributes:
      label: Versions / 版本
      description: Plugin, MaiBot, SDK, adapter, and Python versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction / 复现步骤
      description: Use made-up QQ IDs and synthetic messages. Do not include real chat records.
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Sanitized error / 脱敏报错
      description: Remove API keys, WebUI tokens, QQ IDs, private addresses, and personal profiles.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / 隐私
      options:
        - label: I removed private data and credentials from this report.
          required: true

